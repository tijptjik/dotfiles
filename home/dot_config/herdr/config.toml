onboarding = false

[experimental]
kitty_graphics = true

[ui]
show_agent_labels_on_pane_borders = true

[ui.sidebar.spaces]
row_gap = 1

[ui.toast]
delivery = "system"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
description = "open file viewer"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"
