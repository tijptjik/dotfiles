# Canonical Herdr layout. `herdup` applies this file.
workspaces:
  - name: ~
    root: "~"
    tabs:
      - label: "~"
        panes:
          - command: clear

  - name: hype
    root: ~/code/hype
    tabs:
      - label: hype
        panes:
          - command: clear
      - label: dev
        panes:
          - command: clear
      - label: asset
        panes:
          - command: clear
      - label: studio
        panes:
          - command: clear
      - label: git
        panes:
          - command: clear

  - name: saanseoi
    root: ~/code/saanseoi
    focus: true
    tabs:
      - label: saanseoi
        panes:
          - command: clear
            focus: true
      - label: 山
        panes:
          - command: clear
      - label: 水
        panes:
          - command: clear
      - label: dev
        panes:
          - command: clear; bun run dev
      - label: test
        panes:
          - command: clear; bun run test:watch
      - label: studio
        panes:
          - command: clear; fnm exec --using=25.2.1 bun run db:studio:source:2025
      - label: db
        panes:
          - command: clear
      - label: docs
        panes:
          - command: clear
      - label: git
        panes:
          - command: clear

  - name: overturist
    root: ~/code/overturist
    tabs:
      - label: overturist
        panes:
          - command: clear
      - label: git
        panes:
          - command: clear

  - name: tjikup
    root: ~/.local/share/chezmoi
    tabs:
      - label: tjikup
        panes:
          - command: clear
      - label: Etc
        cwd: ../chezetc
        panes:
          - command: clear
      - label: CTRL
        panes:
          - command: clear
      - label: git
        panes:
          - command: clear
