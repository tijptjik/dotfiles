id = "local-files"
name = "Local file links"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Open local file hyperlinks in the installed Herdr file viewer."
platforms = ["linux"]

[[actions]]
id = "open"
title = "Open local file"
command = ["python3", "open_file.py"]

[[link_handlers]]
id = "local-file"
title = "Open local file"
pattern = '^file://(localhost)?/'
action = "open"
