<title>Herdr — proposed Rose Punk refinement</title><desc>Three pointed timber posts, two blue painted rails and visible fixings. Use substantial aligned posts, a restrained grain line and consistent dark bolts at the rail crossings. Third-batch review selection; source attribution accompanies the bundle.</desc><g id="frameless-artwork" transform="translate(-1.185185 -1.185185) scale(1.037037)"><defs>
