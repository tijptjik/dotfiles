<title>Htop — proposed Rose Punk refinement</title><desc>A process monitor, distinct from Bottom’s dotted activity trace. Use the shared terminal shell, two CPU meters and three readable process rows. Review selection; source attribution accompanies the bundle.</desc><g id="frameless-artwork" transform="translate(0.000000 0.000000) scale(1.000000)"><defs>
