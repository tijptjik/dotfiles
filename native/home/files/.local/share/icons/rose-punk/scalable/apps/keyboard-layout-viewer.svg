<title>Keyboard layout viewer — proposed Rose Punk refinement</title><desc>A naturally wide keyboard with staggered rows. Reduce key count, enlarge the spacebar and distinguish two key groups with pigment. Review selection; source attribution accompanies the bundle.</desc><g id="frameless-artwork" transform="translate(-1.185185 -0.148148) scale(1.037037)"><defs>
