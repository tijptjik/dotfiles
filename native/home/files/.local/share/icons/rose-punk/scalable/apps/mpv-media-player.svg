<title>mpv Media Player — proposed Rose Punk refinement</title><desc>mpv’s circular identity, inner ring and ivory play triangle. Use a restrained violet disc, a quieter concentric ring and a larger optically centred play mark. Third-batch review selection; source attribution accompanies the bundle.</desc><g id="frameless-artwork" transform="translate(-0.571670 -0.571670) scale(1.017865)"><defs>
