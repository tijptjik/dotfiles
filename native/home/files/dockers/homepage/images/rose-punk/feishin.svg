<title>Feishin — proposed Rose Punk refinement</title><desc>Mint turntable, vinyl record, rose label and ivory tonearm. Keep two quiet grooves and a hinged tonearm with a single amber cartridge; simplify the controls. Second-batch review selection; source attribution accompanies the bundle.</desc><g id="frameless-artwork" transform="translate(0.627451 1.117647) scale(0.980392)"><defs>
