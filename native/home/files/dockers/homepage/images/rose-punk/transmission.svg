<title>Transmission — proposed Rose Punk refinement</title><desc>The familiar red handle, ivory housing and centred downward arrow. Give the red handle a quiet underside, keep the central ivory strap and clarify the arrow against the paper body. Second-batch review selection; source attribution accompanies the bundle.</desc><g id="frameless-artwork" transform="translate(-2.107855 -1.574919) scale(1.065870)"><defs>
