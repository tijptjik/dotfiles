<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><title>disks</title><desc>Near-frontal construction study. Shallow right and lower depth; upper-left illumination; material-specific surfaces.</desc><defs>
<linearGradient id="housing" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#cab5e3"/><stop offset=".5" stop-color="#a991ce"/><stop offset="1" stop-color="#8b79b9"/></linearGradient>
<linearGradient id="platter" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2e8ed"/><stop offset=".25" stop-color="#c5cbe4"/><stop offset=".48" stop-color="#8d9fce"/><stop offset=".65" stop-color="#d5dcec"/><stop offset="1" stop-color="#8b9aca"/></linearGradient>
<linearGradient id="arm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe2b4"/><stop offset="1" stop-color="#d19180"/></linearGradient>
</defs><g data-material="authored" stroke-linecap="round" stroke-linejoin="round">
<!-- Open drive viewed square-on: cast tray, shallow side wall and connector. -->
<rect x="12" y="9" width="41" height="47" rx="3" fill="#70608d" stroke="#5f4d71" stroke-width=".85"/>
<rect x="10" y="7" width="41" height="47" rx="3" fill="url(#housing)" stroke="#756084" stroke-width=".85"/>
<path d="M14 8h33" stroke="#e4d4ee" stroke-width="1"/>
<path d="M15 12h30q2 0 2 2v32H14V14Z" fill="#554663"/>
<!-- A spindle and continuous metal reflections replace the quadrant badge. -->
<circle cx="29" cy="29" r="13.5" fill="#31344e"/>
<circle cx="29" cy="28" r="13" fill="url(#platter)"/>
<circle cx="29" cy="28" r="10.5" fill="none" stroke="#dde0ef" stroke-width=".55"/>
<circle cx="29" cy="28" r="5" fill="#7e80ab"/><circle cx="29" cy="28" r="3.6" fill="#d9c9df"/><circle cx="29" cy="28" r="1.5" fill="#65557d"/>
<!-- Pivot and tapered actuator physically overlap the platter edge. -->
<path d="M44 17 43 37 33 32l1-3 6 3 1-15Z" fill="#865b76"/>
<path d="M43 16 42 35 33 30l1-2 6 3 1-15Z" fill="url(#arm)"/>
<circle cx="42" cy="17" r="3" fill="#c1908d"/><circle cx="42" cy="17" r="1.8" fill="#fce1b9"/>
<!-- Fasteners locate the tray; exposed bottom contacts provide orientation. -->
<g fill="#756080"><circle cx="14" cy="11" r="1"/><circle cx="47" cy="11" r="1"/><circle cx="14" cy="49" r="1"/><circle cx="47" cy="49" r="1"/></g>
<path d="M22 49h18v5H22Z" fill="#51405f"/><path d="M25 50v3m4-3v3m4-3v3m4-3v3" stroke="#e9b182" stroke-width="1.2"/>
</g></svg>
