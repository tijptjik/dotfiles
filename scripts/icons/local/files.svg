<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><title>files</title><desc>Near-frontal construction study. Shallow right and lower depth; upper-left illumination; material-specific surfaces.</desc><defs><linearGradient id="card" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#ffd17b"/><stop offset="1" stop-color="#efaa58"/></linearGradient></defs><g data-material="authored" stroke-linecap="round" stroke-linejoin="round">
<!-- Back board and tab; the narrow side gusset is folded card, not a bevel. -->
<path d="M9 22v-7q0-2 2-2h15l6 7h19q3 0 3 3v29H9Z" fill="#d8915d" stroke="#8c6170" stroke-width=".85"/>
<path d="M10 22v-6q0-2 2-2h13l6 7h20l2 2Z" fill="#ffe0a0"/>
<path d="M12 24h39v24H12Z" fill="#886c9e"/>
<!-- Two documents seated in the pocket, aligned to its front. -->
<path d="M16 19h28l5 5v24H16Z" fill="#c8b7e1"/>
<path d="m44 19 5 5h-5Z" fill="#9e85bc"/>
<path d="M13 24h34v25H13Z" fill="#fff1d8"/>
<path d="M18 28h23m-23 4h16" stroke="#d2bfc4" stroke-width="1.1"/>
<!-- Pocket lip, broad untextured face and a single folded right gusset. -->
<path d="M8 31h45l3 2-4 20H12Z" fill="#bb785e" stroke="#8c6170" stroke-width=".85"/>
<path d="M8 31h45l-4 22H12Z" fill="url(#card)"/>
<path d="M9 31.5h43" stroke="#ffe7b0" stroke-width="1.1"/>
<path d="m53 32-2 9 3-7-3 17" fill="none" stroke="#955f66" stroke-width=".9"/>
<!-- Paper identification label held under the pocket's upper edge. -->
<path d="M17 35h17v6H17Z" fill="#c38a65"/><path d="M17 34h17v6H17Z" fill="#fff0d9"/>
<path d="M20 37h10" stroke="#ba8b87" stroke-width="1"/>
</g></svg>
