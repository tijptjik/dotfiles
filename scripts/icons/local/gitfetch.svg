<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
<title>Gitfetch</title>
<desc>A violet repository inbox holding ivory commit cards, with a copper branch and an incoming mint arrow.</desc>
<g data-material="authored" stroke-linejoin="round" stroke-linecap="round">
<defs>
  <linearGradient id="repo-front" x1="9" y1="34" x2="30" y2="58" gradientUnits="userSpaceOnUse"><stop stop-color="#ad94d1"/><stop offset="1" stop-color="#8065b1"/></linearGradient>
  <linearGradient id="repo-paper" x1="18" y1="17" x2="30" y2="43" gradientUnits="userSpaceOnUse"><stop stop-color="#fff0da"/><stop offset="1" stop-color="#e7d4d9"/></linearGradient>
  <linearGradient id="fetch-mint" x1="43" y1="7" x2="51" y2="34" gradientUnits="userSpaceOnUse"><stop stop-color="#76d8c1"/><stop offset="1" stop-color="#3ba69d"/></linearGradient>
</defs>
<!-- Open repository: a dark interior and a distinct folded side. -->
<path d="m8 32 28-14 21 12v15L28 59 8 47Z" fill="#67518f"/>
<path d="m8 32 28-14 21 12-29 15Z" fill="#b39bd9"/>
<path d="m12 32 24-11 17 9-25 12Z" fill="#453b68"/>
<!-- Three offset cards: coloured edges describe real paper thickness. -->
<path d="m13 28 4-14 24 3-4 23-24-3Z" fill="#af9cc7"/>
<path d="m15 25 5-14 23 5-5 24-24-5Z" fill="#f0e5ef"/>
<path d="m15 22 7-11 22 10-10 24-22-10Z" fill="#c3aecb"/>
<path d="m12 22 11-11 21 11-11 24-21-11Z" fill="url(#repo-paper)"/>
<path d="m12 22 11 5 10 19-21-11Z" fill="#f8e8d6"/>
<!-- A single copper Git branch, optically substantial at small sizes. -->
<path d="m23 23-5 12m3-7c6 3 7 2 10-4" fill="none" stroke="#c46e59" stroke-width="2.8"/>
<g fill="#e7a466"><circle cx="23" cy="23" r="2.6"/><circle cx="18" cy="35" r="2.6"/><circle cx="31" cy="24" r="2.6"/></g>
<!-- Fetch arrow: solid mint with a cool folded edge. -->
<path d="M44 7h8v13h7L47 34 35 20h9Z" fill="#328c8e"/>
<path d="M42 6h8v13h7L45 32 33 19h9Z" fill="url(#fetch-mint)"/>
<path d="M42 6h8l2 1h-8Z" fill="#b0e9ce"/>
<!-- Front lip and sidewall remain quiet; a small rose tab breaks the violet. -->
<path d="m8 32 20 11 29-13v15L28 59 8 47Z" fill="url(#repo-front)"/>
<path d="m28 43 29-13v15L28 59Z" fill="#70539e"/>
<path d="m8 32 20 11v4L8 36Z" fill="#c3a9e0"/>
<path d="m28 43 29-13v4L28 47Z" fill="#9978c4"/>
<path d="m14 40 8 4v5l-8-4Z" fill="#f1bad0"/>
<path d="m16 43 4 2" stroke="#aa668e" stroke-width="1"/>
<path d="m33 49 17-8" stroke="#b49bd3" stroke-width="1.1"/>
</g></svg>
