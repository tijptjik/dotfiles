<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
<title>Unpackerr</title><desc>An open kraft-board parcel with folded papers and a single teal unpacking arrow.</desc>
<g data-material="authored" stroke-linecap="round" stroke-linejoin="round">
<defs><linearGradient id="kraft" x1="10" y1="33" x2="29" y2="57" gradientUnits="userSpaceOnUse"><stop stop-color="#d9ae85"/><stop offset="1" stop-color="#c29274"/></linearGradient></defs>
<!-- Board folds, with quiet warm shadows instead of straps or metal trim. -->
<path d="m10 29 23-9 21 9-22 10Z" fill="#806657"/>
<path d="m10 29 23-9-6-7-23 9Z" fill="#e0bc97"/>
<path d="m33 20 21 9 5-7-21-9Z" fill="#d0a882"/>
<!-- A slim sheaf being unpacked. -->
<path d="m19 19 15-6 11 6v18l-15 7-11-6Z" fill="#b9afc9"/>
<path d="m17 17 15-6 11 6v18l-15 7-11-6Z" fill="#f2e5d9"/>
<path d="m17 17 11 6 15-6-11-6Z" fill="#fff0da"/>
<path d="m28 23 15-6v18l-15 7Z" fill="#ddd1db"/>
<path d="m20 24 5 3m-5 1 5 3" fill="none" stroke="#c4a8ad" stroke-width="1.2"/>
<!-- One clean upward arrow: extraction, not a burst of power-ups. -->
<path d="M43 5 54 17h-7v13h-8V17h-7Z" fill="#4ca99f"/>
<path d="M43 5 54 17h-4L43 9Z" fill="#73c6b8"/>
<path d="m10 29 22 10v19L10 48Z" fill="url(#kraft)"/>
<path d="m32 39 22-10v19L32 58Z" fill="#ac806b"/>
<path d="m10 29 22 10-6 7-22-11Z" fill="#efd1aa"/>
<path d="m32 39 22-10 6 6-22 11Z" fill="#dfb995"/>
<path d="m32 40 22-10" fill="none" stroke="#c99c7b" stroke-width=".8"/>
<!-- Paper address label and a short strip of packing tape. -->
<path d="m14 43 10 4v6l-10-4Z" fill="#f6e5ca"/>
<path d="m16 46 6 2.5m-6 0 4 1.7" fill="none" stroke="#aa897b" stroke-width=".8"/>
<path d="m42 45 5-2v8l-5 2Z" fill="#d1a278"/>
</g></svg>
