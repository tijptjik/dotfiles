<title>Bookshelf — proposed Rose Punk refinement</title><desc>The inherited Readarr book curves, rose covers, ivory page edges and circular identity. Retain the original paths, thin the ivory ring and enlarge the book slightly within the dark field. Third-batch review selection; source attribution accompanies the bundle.</desc><g id="frameless-artwork" transform="translate(0.103012 0.103012) scale(0.996781)"><defs>
