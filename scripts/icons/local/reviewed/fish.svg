<title>Fish shell — proposed Rose Punk refinement</title><desc>Jade fish, copper tail and fins, rose dorsal fin and expressive face. Shorten the lower fin, join the pectoral fin more naturally and omit secondary scale marks. Fifth-batch review proposal; source attribution accompanies the bundle.</desc><g id="frameless-artwork" transform="translate(0.000000 2.062500) scale(1.000000)"><defs>
