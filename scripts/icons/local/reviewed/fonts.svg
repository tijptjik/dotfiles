<title>Fonts — proposed Rose Punk refinement</title><desc>Deliberately flat blue tile with a large ivory A and smaller amber a. Draw a clean single-storey bowl and stem and deepen the blue backing to support both letter colours. Sixth-batch review proposal; source attribution accompanies the bundle.</desc><g id="frameless-artwork" transform="translate(-8.000000 -8.000000) scale(1.250000)"><defs>
