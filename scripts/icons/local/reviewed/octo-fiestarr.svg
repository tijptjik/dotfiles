<title>Octo-Fiestarr — proposed Rose Punk refinement</title><desc>Eight arms, octopus mantle, horizontal pupils and headphones. Use eight broad tapered arms; keep cups out of the smallest view and simplify the headset. Review selection; source attribution accompanies the bundle.</desc><g id="frameless-artwork" transform="translate(1.103448 2.551724) scale(0.965517)"><defs>
