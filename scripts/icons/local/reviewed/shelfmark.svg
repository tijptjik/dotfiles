<title>Shelfmark — proposed Rose Punk refinement</title><desc>Rose bookmark, ivory four-point mark, jade cord and tassel. Clarify the eyelet-to-cord connection, use quiet woven margins and separate the hanging tassel from the ribbon. Third-batch review selection; source attribution accompanies the bundle.</desc><g id="frameless-artwork" transform="translate(-1.738272 -3.051852) scale(1.106173)"><defs>
