<title>Terminal — proposed Rose Punk refinement</title><desc>Physical rose terminal housing, dark glass and mint prompt. Keep the accepted casing identity, reduce its bevel, and give the prompt and cursor a consistent stroke. Third-batch review selection; source attribution accompanies the bundle.</desc><g id="frameless-artwork" transform="translate(1.117647 1.117647) scale(0.980392)"><defs>
