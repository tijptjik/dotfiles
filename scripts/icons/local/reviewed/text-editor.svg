<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
<title>Text Editor — proposed Rose Punk refinement</title><desc>Ivory notepad, jade header and coral pencil. Give the pencil a distinct ferrule, wood tip and graphite point; leave clear room between it and the writing. Third-batch review selection; source attribution accompanies the bundle.</desc><g id="frameless-artwork" transform="translate(-2.177187 -0.378387) scale(1.027885)"><defs>
 <linearGradient id="enamel" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#f4c8d7" /><stop offset=".4" stop-color="#e88bb6" /><stop offset="1" stop-color="#b94e87" /></linearGradient>
