# Inside the existing home.type.hk HTTPS server.
location ^~ /atlas-generation/ {
    client_max_body_size 7m;
    proxy_pass http://127.0.0.1:8796/;
    proxy_read_timeout 65s;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    add_header Cache-Control "no-store" always;
}

# Private HYPE extraction API. The worker verifies a dedicated bearer credential.
location ^~ /hype-floorplans/ {
    client_max_body_size 30m;
    proxy_pass http://unix:/run/codex-floorplans/worker.sock:/;
    proxy_read_timeout 65s;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    access_log off;
    add_header Cache-Control "no-store" always;
}
