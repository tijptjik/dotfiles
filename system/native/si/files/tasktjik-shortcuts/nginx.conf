# Independent of Si's public nginx configuration and listener lifecycle.
worker_processes 1;
pid /run/tasktjik-shortcuts/nginx.pid;
error_log stderr notice;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /run/tasktjik-shortcuts/client;
    proxy_temp_path /run/tasktjik-shortcuts/proxy;
    fastcgi_temp_path /run/tasktjik-shortcuts/fastcgi;
    uwsgi_temp_path /run/tasktjik-shortcuts/uwsgi;
    scgi_temp_path /run/tasktjik-shortcuts/scgi;
    server {
        listen 100.85.220.100:80 default_server;
        listen [fd7a:115c:a1e0::32f:dc65]:80 default_server;
        server_name _;
        return 404;
    }
    server {
        listen 100.85.220.100:80;
        listen [fd7a:115c:a1e0::32f:dc65]:80;
        server_name task todo tasktjik task.tjik.internal todo.tjik.internal tasktjik.tjik.internal;
        return 302 https://si.tailb49776.ts.net/tasktjik/;
    }
}
